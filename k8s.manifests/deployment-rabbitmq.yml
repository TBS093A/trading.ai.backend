---
# RabbitMQ Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-ai-backend-rabbitmq
  namespace: default
  labels:
    app: trading-ai-backend-rabbitmq
    component: message-broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trading-ai-backend-rabbitmq
  template:
    metadata:
      labels:
        app: trading-ai-backend-rabbitmq
        component: message-broker
    spec:
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsGroup: 999
      
      containers:
        - name: trading-ai-backend-rabbitmq
          image: rabbitmq:3-management-alpine
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                configMapKeyRef:
                  name: trading-ai-config
                  key: RABBITMQ_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: trading-ai-secrets
                  key: RABBITMQ_PASSWORD
          volumeMounts:
            - name: rabbitmq-storage
              mountPath: /var/lib/rabbitmq
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - ping
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - check_running
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: rabbitmq-storage
          persistentVolumeClaim:
            claimName: pvc-trading-ai-backend-rabbitmq

---
# RabbitMQ Service (AMQP)
apiVersion: v1
kind: Service
metadata:
  name: trading-ai-backend-rabbitmq-service
  namespace: default
  labels:
    app: trading-ai-backend-rabbitmq
spec:
  type: ClusterIP
  ports:
    - port: 5672
      targetPort: 5672
      protocol: TCP
      name: amqp
  selector:
    app: trading-ai-backend-rabbitmq

---
# RabbitMQ Service (Management UI)
apiVersion: v1
kind: Service
metadata:
  name: trading-ai-backend-rabbitmq-management
  namespace: default
  labels:
    app: trading-ai-backend-rabbitmq
spec:
  type: ClusterIP
  ports:
    - port: 15672
      targetPort: 15672
      protocol: TCP
      name: management
  selector:
    app: trading-ai-backend-rabbitmq

---
# RabbitMQ PersistentVolume
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-trading-ai-backend-rabbitmq
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteMany
  hostPath:
    path: /k8s/pv/trading-ai-backend-rabbitmq
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - k8s.node.001
---
# RabbitMQ PersistentVolumeClaim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-trading-ai-backend-rabbitmq
  namespace: default
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Gi
  volumeName: pv-trading-ai-backend-rabbitmq
