---
# Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-ai-backend-redis
  namespace: default
  labels:
    app: trading-ai-backend-redis
    component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trading-ai-backend-redis
  template:
    metadata:
      labels:
        app: trading-ai-backend-redis
        component: cache
    spec:
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsGroup: 999
      
      containers:
        - name: trading-ai-backend-redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          command:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-ai-secrets
                  key: REDIS_PASSWORD
          volumeMounts:
            - name: redis-storage
              mountPath: /data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            exec:
              command:
                - redis-cli
                - --no-auth-warning
                - -a
                - $(REDIS_PASSWORD)
                - ping
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - redis-cli
                - --no-auth-warning
                - -a
                - $(REDIS_PASSWORD)
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: redis-storage
          persistentVolumeClaim:
            claimName: pvc-trading-ai-backend-redis

---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: trading-ai-backend-redis-service
  namespace: default
  labels:
    app: trading-ai-backend-redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app: trading-ai-backend-redis

---
# Redis PersistentVolume
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-trading-ai-backend-redis
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  hostPath:
    path: /k8s/pv/trading-ai-backend-redis
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - k8s.node.001
---
# Redis PersistentVolumeClaim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-trading-ai-backend-redis
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  volumeName: pv-trading-ai-backend-redis

