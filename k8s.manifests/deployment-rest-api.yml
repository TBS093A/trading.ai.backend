---
# REST API Controller Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-ai-backend-rest-api-controller
  namespace: default
  labels:
    app: trading-ai-backend-rest-api-controller
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trading-ai-backend-rest-api-controller
  template:
    metadata:
      labels:
        app: trading-ai-backend-rest-api-controller
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9090"
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      
      initContainers:
        - name: fix-permissions
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              mkdir -p /app
              chown -R 1000:1000 /app
              chmod -R 755 /app
          volumeMounts:
            - name: app-storage
              mountPath: /app
          securityContext:
            runAsUser: 0
        
        - name: remove-old-files
          image: alpine/git
          command:
            - "sh"
            - "-c"
            - >
              find /app/ -mindepth 1 -delete;
          volumeMounts:
            - name: app-storage
              mountPath: /app
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
        
        - name: clone-repo
          image: alpine/git
          command:
            - "sh"
            - "-c"
            - >
              git clone $(TRADING_AI_BACKEND_REPO_URL) -b $(TRADING_AI_BACKEND_REPO_BRANCH) /app/;
          env:
            - name: TRADING_AI_BACKEND_REPO_URL
              valueFrom:
                configMapKeyRef:
                  name: trading-ai-config
                  key: TRADING_AI_BACKEND_REPO_URL
            - name: TRADING_AI_BACKEND_REPO_BRANCH
              valueFrom:
                configMapKeyRef:
                  name: trading-ai-config
                  key: TRADING_AI_BACKEND_REPO_BRANCH
          volumeMounts:
            - name: app-storage
              mountPath: /app
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
        
        - name: setup-environment
          image: python:3.13.1
          command:
            - /bin/bash
            - -c
            - |
              apt update -y;
              apt upgrade -y;
              apt install python3-pip -y;
              pip3 install --upgrade pip setuptools;
              pip3 install --target=/app/python-packages tox==4.30.3;
          volumeMounts:
            - name: app-storage
              mountPath: /app
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
      
      containers:
        - name: trading-ai-backend-rest-api-controller
          image: python:3.13.1
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - containerPort: 9090
              name: http
              protocol: TCP
          command:
            - /bin/bash
            - -c
            - |
              export DATABASE_URL="postgresql://${DATABASE_USERNAME}:${DATABASE_PASSWORD}@${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_SCHEMA}"
              export CELERY_BROKER_URL="pyamqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@trading-ai-backend-rabbitmq-service:${RABBITMQ_PORT}//"
              export CELERY_RESULT_BACKEND="redis://:${REDIS_PASSWORD}@trading-ai-backend-redis-service:${REDIS_PORT}/0"
              cd /app;
              python -m tox run -e rest-api-controller;
          env:
            - name: PYTHONPATH
              value: "/app/python-packages"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            
            # Database configuration
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: trading-ai-config
                  key: DATABASE_HOST
            - name: DATABASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: trading-ai-config
                  key: DATABASE_PORT
            - name: DATABASE_SCHEMA
              valueFrom:
                configMapKeyRef:
                  name: trading-ai-config
                  key: DATABASE_SCHEMA
            - name: DATABASE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: trading-ai-config
                  key: DATABASE_USERNAME
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-ai-secrets
                  key: DATABASE_PASSWORD
            
            # RabbitMQ configuration
            - name: RABBITMQ_USER
              valueFrom:
                configMapKeyRef:
                  name: trading-ai-config
                  key: RABBITMQ_USER
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: trading-ai-config
                  key: RABBITMQ_PORT
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-ai-secrets
                  key: RABBITMQ_PASSWORD
            
            # Redis configuration
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: trading-ai-config
                  key: REDIS_PORT
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-ai-secrets
                  key: REDIS_PASSWORD
            
            # Telethon credentials
            - name: TELETHON_BOT_NAME
              valueFrom:
                secretKeyRef:
                  name: trading-ai-secrets
                  key: TELETHON_BOT_NAME
            - name: TELETHON_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: trading-ai-secrets
                  key: TELETHON_BOT_TOKEN
            - name: TELETHON_API_PHONE
              valueFrom:
                secretKeyRef:
                  name: trading-ai-secrets
                  key: TELETHON_API_PHONE
            - name: TELETHON_API_ID
              valueFrom:
                secretKeyRef:
                  name: trading-ai-secrets
                  key: TELETHON_API_ID
            - name: TELETHON_API_HASH
              valueFrom:
                secretKeyRef:
                  name: trading-ai-secrets
                  key: TELETHON_API_HASH
            - name: TELETHON_USER_ID
              valueFrom:
                secretKeyRef:
                  name: trading-ai-secrets
                  key: TELETHON_USER_ID
            - name: TELETHON_BOT_ID
              valueFrom:
                secretKeyRef:
                  name: trading-ai-secrets
                  key: TELETHON_BOT_ID
            
            # Exchange API credentials
            - name: KUCOIN_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: trading-ai-secrets
                  key: KUCOIN_API_SECRET
            - name: KUCOIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: trading-ai-secrets
                  key: KUCOIN_API_KEY
            - name: KUCOIN_API_KEY_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: trading-ai-secrets
                  key: KUCOIN_API_KEY_PASSPHRASE
            - name: MEXC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: trading-ai-secrets
                  key: MEXC_API_KEY
            - name: MEXC_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: trading-ai-secrets
                  key: MEXC_API_SECRET
            
            # AI/LLM credentials
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: trading-ai-secrets
                  key: OPENAI_API_KEY
            
            # News API credentials
            - name: CRYPTO_PANIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: trading-ai-secrets
                  key: CRYPTO_PANIC_API_KEY
            - name: GNEWS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: trading-ai-secrets
                  key: GNEWS_API_KEY
            - name: COINDESK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: trading-ai-secrets
                  key: COINDESK_API_KEY
            
            # MinIO credentials
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: trading-ai-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: trading-ai-secrets
                  key: MINIO_SECRET_KEY
            - name: MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: trading-ai-config
                  key: MINIO_ENDPOINT
            - name: MINIO_SECURE
              valueFrom:
                configMapKeyRef:
                  name: trading-ai-config
                  key: MINIO_SECURE
            - name: MINIO_BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  name: trading-ai-config
                  key: MINIO_BUCKET_NAME
            
            # Storage configuration
            - name: LOCAL_STORAGE_IS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: trading-ai-config
                  key: LOCAL_STORAGE_IS_ENABLED
            - name: LOCAL_STORAGE_PATH
              valueFrom:
                configMapKeyRef:
                  name: trading-ai-config
                  key: LOCAL_STORAGE_PATH
            
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: trading-ai-config
                  key: CORS_ALLOWED_ORIGINS
            
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: trading-ai-secrets
                  key: ADMIN_USERNAME
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-ai-secrets
                  key: ADMIN_PASSWORD
            - name: ADMIN_CREATE_FORCE
              valueFrom:
                configMapKeyRef:
                  name: trading-ai-config
                  key: ADMIN_CREATE_FORCE
            - name: SESSION_EXPIRY_PERIOD
              valueFrom:
                configMapKeyRef:
                  name: trading-ai-config
                  key: SESSION_EXPIRY_PERIOD
          
          volumeMounts:
            - name: app-storage
              mountPath: /app
          
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          
          startupProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 18
      
      volumes:
        - name: app-storage
          persistentVolumeClaim:
            claimName: pvc-trading-ai-backend-rest-api

---
# REST API PersistentVolume
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-trading-ai-backend-rest-api
spec:
  capacity:
    storage: 25Mi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /k8s/pv/trading-ai-backend-rest-api
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - k8s.node.002

---
# REST API PersistentVolumeClaim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-trading-ai-backend-rest-api
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 25Mi
  volumeName: pv-trading-ai-backend-rest-api

---
# REST API Service
apiVersion: v1
kind: Service
metadata:
  name: trading-ai-backend-rest-api-service
  namespace: default
  labels:
    app: trading-ai-backend-rest-api-controller
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: http
  selector:
    app: trading-ai-backend-rest-api-controller

