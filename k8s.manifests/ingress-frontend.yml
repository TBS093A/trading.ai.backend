# Wymaga: Ingress Controller (nginx). DNS: 00x097.com → adres LoadBalancera / ingressu
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trading-ai-frontend
  namespace: default
  labels:
    app: trading-ai-frontend-web
    component: frontend
spec:
  ingressClassName: nginx
  rules:
    - host: 00x097.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trading-ai-frontend-service
                port:
                  number: 80
