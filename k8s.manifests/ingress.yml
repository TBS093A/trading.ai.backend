# Ingress NGINX + cert-manager. DNS: 00x097.com → frontend SPA, api.00x097.com → backend REST API
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trading-ai-frontend
  namespace: default
  labels:
    app: trading-ai-frontend-web
    component: frontend
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - 00x097.com
      secretName: 00x097-trading-tls
  rules:
    - host: 00x097.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trading-ai-frontend-service
                port:
                  name: http

---
# Backend API: api.00x097.com → REST API service (osobna subdomena, bez rewrite)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trading-ai-backend-api
  namespace: default
  labels:
    app: trading-ai-backend-rest-api-controller
    component: backend
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - api.00x097.com
      secretName: api-00x097-trading-tls
  rules:
    - host: api.00x097.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trading-ai-backend-rest-api-service
                port:
                  number: 9090
