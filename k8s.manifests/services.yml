---
# RabbitMQ Service (AMQP)
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
  namespace: default
  labels:
    app: rabbitmq
    component: message-broker
spec:
  type: ClusterIP
  ports:
    - port: 5672
      targetPort: 5672
      protocol: TCP
      name: amqp
  selector:
    app: rabbitmq

---
# RabbitMQ Service (Management UI)
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-management
  namespace: default
  labels:
    app: rabbitmq
    component: message-broker
spec:
  type: NodePort
  ports:
    - port: 15672
      targetPort: 15672
      protocol: TCP
      name: management
      nodePort: 30672
  selector:
    app: rabbitmq

---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: default
  labels:
    app: redis
    component: cache
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app: redis

---
# REST API Service
apiVersion: v1
kind: Service
metadata:
  name: rest-api-service
  namespace: default
  labels:
    app: rest-api-controller
    component: backend
spec:
  type: NodePort
  ports:
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: http
      nodePort: 30090
  selector:
    app: rest-api-controller

