---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pump-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pump-bot-api-tests
  template:
    metadata:
      labels:
        app: pump-bot-api-tests
    spec:
      initContainers:
        - name: remove-old-files
          image: alpine/git
          command:
            - "sh"
            - "-c"
            - >
              find /pump.bot/ -mindepth 1 -delete;
          volumeMounts:
            - name: pump-bot-storage
              mountPath: /pump.bot
        - name: clone-repo
          image: alpine/git
          command:
            - "sh"
            - "-c"
            - >
              git clone <<pump.bot.repo.url>> /pump.bot/;
          volumeMounts:
            - name: pump-bot-storage
              mountPath: /pump.bot
      containers:
        - name: pump-bot-api-tests
          image: python:3.11.0
          restartPolicy: Never
          command:
            - /bin/bash
            - -c
            - |
              apt update -y;
              apt upgrade -y;
              apt install python3-pip -y
              pip3 install --upgrade pip setuptools;
              pip3 install tox;
              cd /app;
              . ./.env;
              python -m tox -e api-tests;
          volumeMounts:
            - name: pump-bot-storage
              mountPath: /app
            - name: config-volume
              mountPath: /app/.env
              subPath: .env
      volumes:
        - name: pump-bot-storage
          persistentVolumeClaim:
            claimName: pvc-pump-bot
        - name: config-volume
          configMap:
            name: pump-bot-config
            items:
              - key: .env
                path: .env
