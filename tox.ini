    MEXC_API_KEY
    MEXC_API_SECRET
    OPENAI_API_KEY
    DATABASE_URL
    TEST_DATABASE_URL
    CRYPTO_PANIC_API_KEY
    GNEWS_API_KEY
    MINIO_ACCESS_KEY
    MINIO_SECRET_KEY
    MINIO_ENDPOINT
    MINIO_SECURE
    LOCAL_STORAGE_IS_ENABLED
