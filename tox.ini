# Tox (https://tox.readthedocs.io/) is a tool for running tests
# in multiple virtualenvs. This configuration file will run the
# tests suite on all supported python versions. To use it, "pip install tox"
# and then run "tox" from this directory.

[tox]
envlist = py311
toxworkdir={toxinidir}/.tox

[testenv:sync-controller]
pass_env=
    TELETHON_BOT_NAME
    TELETHON_BOT_TOKEN
    TELETHON_API_PHONE
    TELETHON_API_ID
    TELETHON_API_HASH
    TELETHON_USER_ID
    TELETHON_BOT_ID
    KUCOIN_API_SECRET
    KUCOIN_API_KEY
    KUCOIN_API_KEY_PASSPHRASE
    MEXC_API_KEY
    MEXC_API_SECRET
    OPENAI_API_KEY
    DATABASE_URL
    TEST_DATABASE_URL
    CRYPTO_PANIC_API_KEY
    GNEWS_API_KEY
    COINDESK_API_KEY
    MINIO_ACCESS_KEY
    MINIO_SECRET_KEY
    MINIO_ENDPOINT
    MINIO_SECURE
    MINIO_BUCKET_NAME
    LOCAL_STORAGE_IS_ENABLED
    LOCAL_STORAGE_PATH
    CELERY_BROKER_URL
    CELERY_RESULT_BACKEND
deps =
    requests==2.31.0
    python-telegram-bot==21.4
    telethon==1.36.0
    kucoin-python==1.0.23
    asyncio==3.4.3
    pymexc==1.0.11
    binance-connector==3.8.1
    mplfinance==0.12.10b0
    openai==1.97.1
    pyharmonics==1.5.3
    asyncpg==0.30.0
    python-dotenv==1.1.1
    tiktoken==0.9.0
    minio==7.2.0
    apscheduler==3.10.4
    fastapi>=0.104.1
    uvicorn>=0.24.0
    pydantic>=2.8.0
    celery>=5.3.0
    redis>=4.5.0
    aio-pika>=9.0.0
commands =
    python3 ./main_controller_sync.py

