# Tox (https://tox.readthedocs.io/) is a tool for running tests
# in multiple virtualenvs. This configuration file will run the
# tests suite on all supported python versions. To use it, "pip install tox"
# and then run "tox" from this directory.

[tox]
envlist = py313
toxworkdir={toxinidir}/.tox

[testenv]
basepython = python3.13

[testenv:sync-controller]
pass_env=
    TELETHON_BOT_NAME
    TELETHON_BOT_TOKEN
    TELETHON_API_PHONE
    TELETHON_API_ID
    TELETHON_API_HASH
    TELETHON_USER_ID
    TELETHON_BOT_ID
    KUCOIN_API_SECRET
    KUCOIN_API_KEY
    KUCOIN_API_KEY_PASSPHRASE
    MEXC_API_KEY
    MEXC_API_SECRET
    OPENAI_API_KEY
    DATABASE_URL
    TEST_DATABASE_URL
    CRYPTO_PANIC_API_KEY
    GNEWS_API_KEY
    COINDESK_API_KEY
    MINIO_ACCESS_KEY
    MINIO_SECRET_KEY
    MINIO_ENDPOINT
    MINIO_SECURE
    MINIO_BUCKET_NAME
    LOCAL_STORAGE_IS_ENABLED
    LOCAL_STORAGE_PATH
    CELERY_BROKER_URL
    CELERY_RESULT_BACKEND
    ADMIN_USERNAME
    ADMIN_PASSWORD
    ADMIN_CREATE_FORCE
    SESSION_EXPIRY_PERIOD
    CORS_ALLOWED_ORIGINS
deps =
    requests==2.31.0
    python-telegram-bot==21.4
    telethon==1.36.0
    kucoin-python==1.0.23
    asyncio==3.4.3
    pymexc==1.0.11
    binance-connector==3.8.1
    mplfinance==0.12.10b0
    openai==1.97.1
    pyharmonics==1.5.3
    alpaca-trade-api==3.2.0
    alpha_vantage==2.3.1
    curl_cffi<0.14
    asyncpg==0.30.0
    python-dotenv==1.1.1
    tiktoken==0.9.0
    minio==7.2.0
    apscheduler==3.10.4
    fastapi==0.141.1
    uvicorn==0.53.0
    pydantic==2.13.5
    celery==5.6.3
    redis==8.1.0
    aio-pika==10.0.1
    bcrypt>=4.0.0
    python-multipart>=0.0.6
    yfinance>=0.2.40
commands =
    python3 ./main_controller_sync.py

